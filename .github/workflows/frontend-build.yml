name: Build Workflow

on:
  workflow_call:
    inputs:
      application-host:
        required: true
        type: string
      application-path:
        required: true
        type: string
      application-host-user:
        required: true
        type: string
      api-url:
        required: true
        type: string
      deploy:
        description: Whether to publish the built output to the application host.
        required: false
        type: boolean
        default: false
    secrets:
      ssh-key:
        description: Only needed when deploy is true.
        required: false
      consumer-secret:
        description: Only needed when deploy is true. The production build does not need it, since every route is server-rendered on demand and the value is only read at runtime.
        required: false
      session-secret:
        description: Only needed when deploy is true. The production build does not need it, since every route is server-rendered on demand and the value is only read at runtime.
        required: false

jobs:
  Run-Build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with: 
        node-version: '22.x' 
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
          
    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm test

    - name: Run lint
      run: npm run lint

    - name: Run TypeScript checks
      run: npm run typecheck
      
    - name: 'Create env file'
      env:
       SERVER_SECRET: ${{ secrets.consumer-secret }}
       SESSION_SECRET: ${{ secrets.session-secret }}
       API_URL: ${{ inputs.api-url }}
      run: |
       umask 077
       printf '%s\n' \
         "SERVER_SECRET=$SERVER_SECRET" \
         "SESSION_SECRET=$SESSION_SECRET" \
         "API_URL=$API_URL" \
         "NEXT_PUBLIC_SESSION_TIMEOUT=1500" \
         "NEXT_PUBLIC_SESSION_DIALOG_TIMEOUT=120" \
         "NEXT_TELEMETRY_DISABLED=1" > .env
       
    - name: Running build
      run: npm run build
      
    - name: Remove src folder
      run: rm -rf src
      
    - name: Deploy with rsync
      if: ${{ inputs.deploy }}
      uses: burnett01/rsync-deployments@7.0.2
      with: 
        switches: -avzr --delete  --exclude=".git" --exclude=".github" --exclude=".vscode" --exclude="node_modules"
        path: ./frontend/
        remote_path: ${{ inputs.application-path }}carcare-app/
        remote_host: ${{ inputs.application-host }}
        remote_user: ${{ inputs.application-host-user }}
        remote_key: ${{ secrets.ssh-key }}
        
    - name: Reloading carcare-app pm2 process
      if: ${{ inputs.deploy }}
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: ${{ inputs.application-host }}
        username: ${{ inputs.application-host-user }}
        key: ${{ secrets.ssh-key }}
        script: "cd ${{ inputs.application-path }}carcare-app; pwd; npm install; pm2 reload carcare-app"
