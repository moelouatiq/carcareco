name: Build Workflow

on:
  workflow_call:
    inputs:
      application-host:
        required: true
        type: string
      application-host-user:
        required: true
        type: string
      application-path:
        required: true
        type: string
      deploy:
        description: Whether to publish the built output to the application host.
        required: false
        type: boolean
        default: false
    secrets:
      ssh-key:
        description: Only needed when deploy is true.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    # All shell commands will execute from the backend/ directory
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      #  .NET SDK ----------------------------------------------------------------
      - name: Setup .NET 9.x SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.200"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # ---------------------------------------------------------------------
      #  Build -------------------------------------------------------------------
      - name: Restore locked dependencies
        run: dotnet restore src/Carmasters.sln --locked-mode

      - name: Run backend unit tests
        run: dotnet test src/Carmasters.Tests/Carmasters.Tests.csproj -c Release --no-restore --filter "Category!=Integration"

      - name: Build API
        run: dotnet build -c Release --no-restore -o ../../dist/carcare
        working-directory: backend/src/Carmasters.Http.Api
        
      - name: Build DbUp
        run: dotnet build -c Release --no-restore -o ../../dist/dbup
        working-directory: backend/src/DbUp

      # ---------------------------------------------------------------------
      #  Deploy ------------------------------------------------------------------
      - name: Deploy DbUp with rsync
        if: ${{ inputs.deploy }}
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude="appsettings.Secrets.json"
          path: backend/dist/dbup
          remote_path: ${{ inputs.application-path }}
          remote_host: ${{ inputs.application-host }}
          remote_user: ${{ inputs.application-host-user }}
          remote_key: ${{ secrets.ssh-key }}

      - name: Deploy API with rsync
        if: ${{ inputs.deploy }}
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude="appsettings.Secrets.json" --exclude="Carmasters.Http.Api.staticwebassets.runtime.json"
          path: backend/dist/carcare
          remote_path: ${{ inputs.application-path }}
          remote_host: ${{ inputs.application-host }}
          remote_user: ${{ inputs.application-host-user }}
          remote_key: ${{ secrets.ssh-key }}
          
      - name: Run DbUp migrations and reload API
        if: ${{ inputs.deploy }}
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ inputs.application-host }}
          username: ${{ inputs.application-host-user }}
          key: ${{ secrets.ssh-key }}
          script: |
            sudo service carcare stop
            ${{ inputs.application-path }}dbup/DbUp
            sudo service carcare start
            sudo service carcare status
            sudo journalctl --unit=carcare.service -n 20 --no-pager
