name: CI (monorepo)

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
  push:
    branches: [main]

jobs:
  backend:
    if: contains(github.event.head_commit.message, '[skip-backend]') == false
    uses: ./.github/workflows/backend-build.yml
    with:
      application-host: carcareco.app
      application-path: /opt/apps/
      application-host-user: debian
      # Pull requests validate only. Deployment stays tied to the upstream
      # repository, so a fork never targets infrastructure it does not own.
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rene98c/carcareco' }}
    secrets:
      ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

  frontend:
    if: contains(github.event.head_commit.message, '[skip-frontend]') == false
    uses: ./.github/workflows/frontend-build.yml
    with:
      api-url: http://localhost:15567
      application-host: carcareco.app
      application-path: /opt/apps/
      application-host-user: debian
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rene98c/carcareco' }}
    secrets:
      ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      consumer-secret: ${{ secrets.CONSUMER_SECRET }}
      session-secret: ${{ secrets.SESSION_SECRET }}
