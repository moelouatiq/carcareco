services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run the setup-secrets script first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the setup-secrets script first}
      POSTGRES_DB: ${POSTGRES_DB:-carcare}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      retries: 10

  migrate:
    volumes:
      - ./backend/src/Carmasters.Http.Api/appsettings.Secrets.json:/app/appsettings.Secrets.json:ro
    build:
      context: .
      dockerfile: backend/DbUp.Dockerfile
    environment:
      CARCARE_ADMIN_USERNAME: ${CARCARE_ADMIN_USERNAME:?Run the setup-secrets script first}
      CARCARE_ADMIN_PASSWORD: ${CARCARE_ADMIN_PASSWORD:?Run the setup-secrets script first}
      CARCARE_ADMIN_EMAIL: ${CARCARE_ADMIN_EMAIL:-admin@example.invalid}
    depends_on:
      db:
        condition: service_healthy

  api:
    volumes:
      - ./backend/src/Carmasters.Http.Api/appsettings.Secrets.json:/app/appsettings.Secrets.json:ro
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "15567:15567"

  web:
    env_file:
      - frontend/.env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  dbdata:
