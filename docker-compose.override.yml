services:
  api:
    # The dev stage keeps the SDK; the runtime image has none, so `dotnet watch`
    # could never have run there. The stage's ENTRYPOINT starts the watcher from
    # /src, which is where the sources below are mounted.
    build:
      target: dev
    volumes:
      - ./backend/src:/src
  web:
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules          # keeps container‑only deps intact
  db:
    ports:
      - "5432:5432"               # optional: expose for local psql
